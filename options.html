<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>ClickPassword — options</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0f766e;
        --border: #e2e8f0;
      }
      body {
        margin: 0;
        padding: 16px;
        font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
        padding: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      label {
        font-weight: 600;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
      }
      input[type="number"] {
        width: 88px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status {
        min-height: 1.2em;
        color: var(--accent);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>ClickPassword</h1>
    <p>Réglages synchronisés avec ton compte Chrome.</p>

    <div class="field">
      <label for="autoRehideSeconds">Auto-remasquer (secondes)</label>
      <span class="hint">0 = désactivé. Après affichage, le champ redevient password.</span>
      <input id="autoRehideSeconds" type="number" min="0" max="600" step="1" />
    </div>

    <div class="field">
      <label class="row">
        <input id="showEyeIcons" type="checkbox" />
        Afficher l’icône œil dans les champs
      </label>
    </div>

    <div class="field">
      <label class="row">
        <input id="showBadge" type="checkbox" />
        Badge / contour sur les champs révélés
      </label>
    </div>

    <div class="status" id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
